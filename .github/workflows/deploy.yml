name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - run: npm run build
        env:
          # Not secret — just the public Worker URL from worker/README.md.
          # Leave unset until the Worker is deployed; emailApi.ts skips
          # sending (instead of failing) when this is empty.
          VITE_EMAIL_WORKER_URL: ${{ vars.VITE_EMAIL_WORKER_URL }}
      - run: npx playwright install --with-deps chromium
        env:
          # apt's needrestart prompt can hang waiting for input on
          # ubuntu-latest runners — force it to run non-interactively.
          DEBIAN_FRONTEND: noninteractive
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4


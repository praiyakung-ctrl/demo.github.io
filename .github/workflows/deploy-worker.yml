name: Deploy Email Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      # Requires a CLOUDFLARE_API_TOKEN repo secret (Cloudflare dashboard →
      # My Profile → API Tokens → "Edit Cloudflare Workers" template) and
      # BREVO_API_KEY set once via `wrangler secret put` (not managed here).
      #
      # cloudflare/wrangler-action installs its own separate copy of wrangler,
      # which repeatedly conflicted with @cloudflare/workers-types (ERESOLVE)
      # regardless of pinned version — use the wrangler already installed by
      # `npm install` above instead (the exact one deployed manually before).
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
